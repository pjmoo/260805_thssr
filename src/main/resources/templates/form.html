<!doctype html>
<html lang="ko">
<!--<html lang="ko" xmlns:th="http://www.thymeleaf.org">-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>김자바네 서점</title>
</head>
<body>
<h1>김자바네 서점</h1>
<section>
    <a th:href="@{/books}">목록으로</a>
</section>
<section>
    <!--          th:action="@{${bookId == null ? '/books' : '/books/' + bookId}}"-->
    <form style="display: flex; flex-direction: column; gap: 8px; align-items: center;"
          th:method="post"
          th:action="@{${bookId == null ? '/books/new' : '/books/' + bookId + '/edit'}}"
          th:object="${bookForm}">
        <div th:if="${#fields.hasAnyErrors()}">
            <mark>검증을 통과하지 못했습니다!</mark>
        </div>
        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>
        <label>
            제목 : <input th:field="*{title}">
        </label>
        <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
        <label>
            저자 : <input th:field="*{author}">
        </label>
        <p th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></p>
        <label>
            가격 : <input type="number" th:field="*{price}">
        </label>
        <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
        <label>
            할인가 : <input type="number" th:field="*{discountPrice}">
        </label>
        <!--        <p th:if="${#fields.hasErrors('discountPrice')}" th:errors="*{discountPrice}"></p>-->
        <label th:if="${bookId != null}">
            판매여부 : <input type="checkbox" th:field="*{isAvailable}">
        </label>
        <!--        <p th:if="${#fields.hasErrors('isAvailable')}" th:errors="*{isAvailable}"></p>-->
        <label>
            카테고리 : <select th:field="*{category}">
            <option th:each="cat : ${categories}"
                    th:value="${cat}"
                    th:text="${cat}"></option>
        </select>
        </label>
        <!--        <button>등록</button>-->
        <button th:text="${bookId == null ? '등록' : '수정'}"></button>
    </form>
</section>
</body>
</html>
